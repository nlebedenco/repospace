# $schema: https://json.schemastore.org/pre-commit-config.json

# See https://pre-commit.com/hooks.html
# See https://pre-commit.com/#adding-pre-commit-plugins-to-your-project
minimum_pre_commit_version: "4.5.0"

default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
  - commit-msg

repos:
  - repo: git@gitea.local:homelab/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: destroyed-symlinks
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # preserve markdown hard linebreaks
        exclude: (\.patch)$
        # Exclude .idea/*.xml files from the end-of-file-fixer because CLion keeps removing the final EOL in some.
        # Exclude patch files as they are sensitive to whitespace
        # Exclude .vscode/zephyr-ide.json because the Zephyr IDE extension constantly overwrites this file without a
        # trailing EOL
      - id: end-of-file-fixer
        exclude: (\.idea/.+\.xml|\.patch|\.vscode/zephyr-ide.json)$
        # It's important that the mixed-line-ending checks comes AFTER end-of-file-fixer because the latter can only
        # append LF - even on files supposed to use CRLF - so we have to rely on mixed-line-ending to fix cases when
        # the file should end with a CRLF.
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: ^(.+\.patch)$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
        # Exclude Unicode data from checks-added-large-files because these text files may be as large as 2MB
      - id: check-added-large-files
        args: [--maxkb=2048] # if git-lfs is installed, lfs files will be skipped (requires git-lfs>=2.2.1)
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Exclude .vscode/*.json files which may contain comments
        exclude: (\.vscode/.*\.json)$
  - repo: git@gitea.local:homelab/pre-commit-check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        files: (\.vscode/.*\.json)$ # only .vscode/*.json files support comments
  - repo: local
    hooks:
      # HACK: Restore the previous commit message backup (if exists) created if the last invocation of gitlint failed
      - id: pre-commit-prepare
        name: pre-commit-prepare
        entry: scripts/gitlint/pre-commit-prepare.py
        language: script
        stages: [prepare-commit-msg]
      # Must run (i.e. be declared) before pre-commit-gitlint below: pre-commit runs commit-msg-stage hooks in config
      # order, and gitlint must see the trimmed message, not the raw one. If gitlint ran first, it would lint the
      # message before trailing whitespace is trimmed, fail, and its wrapper would back up the untrimmed message for
      # the next attempt - causing the same failure to repeat forever.
      #
      # The trimming is a script rather than "sed -i -E 's/[[:space:]]+$//'" so that it also works off Linux: a
      # language:system entry is executed directly, without a shell, so sed has to be on PATH (it is not on a plain
      # Windows box, which would then reject every commit), and BSD/macOS sed reads the -E after -i as the backup
      # suffix instead of a flag, which leaves the message untrimmed and drops a stray backup file next to it.
      - id: pre-commit-trim
        name: Trim trailing whitespace in commit message
        entry: scripts/gitlint/pre-commit-trim.py # commit-msg file is appended by pre-commit
        language: script
        stages: [commit-msg]
      # Runs the gitlint installed in the python venv (gitlint-core is a dev dependency in pyproject.toml) through a
      # wrapper that backs up the message when linting fails, so it can be restored by pre-commit-prepare in the next
      # attempt. Like every other language:script/system hook here, this relies on the venv being on PATH.
      - id: pre-commit-gitlint
        name: gitlint
        entry: scripts/gitlint/pre-commit-run.py # commit-msg file is appended by pre-commit
        language: script
        stages: [commit-msg]
      # HACK: black's find_project_root() takes the common ancestor of ALL given sources, then walks up from there
      #       looking for .git/pyproject.toml. With only the matched files as sources, that walk starts at each
      #       file's own directory and can stop at a nested .git (e.g. a west-managed submodule) before reaching the
      #       real repo root. Passing pyproject.toml (resolved against pre-commit's cwd, i.e. the repo root) as an
      #       extra source pins the common ancestor there instead.
      - id: format-python
        name: format-python
        language: system
        entry: black
        args: [--quiet, pyproject.toml]
        types_or: [python, pyi]
        files: '\.(py|pyi)$'
      - id: format-markdown
        name: format-markdown
        language: system
        entry: markdownlint-cli2
        args: [--fix]
        types_or: [markdown]
        files: '\.md$'
