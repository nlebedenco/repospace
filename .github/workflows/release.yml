# Build, test and publish a release to PyPI when a version tag is pushed.
#
# Publishing uses PyPI trusted publishing (OpenID Connect): no API token is stored in the
# repository. The pending publisher registered on PyPI must name this file (release.yml) and the
# "pypi" environment used by the publish job.
#
# The tag must equal "v" + repospace.__version__ (src/repospace/__init__.py); the build job fails
# otherwise.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "src")
          import repospace

          tag = os.environ["GITHUB_REF_NAME"]
          expected = "v" + repospace.__version__
          if tag != expected:
              sys.exit(f"tag {tag} does not match repospace.__version__ ({expected} expected)")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test the wheel on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The tests run against the built wheel, not the checkout: src/ is not on sys.path with the
      # src layout, so "import repospace" resolves to the installed package.
      - name: Install the wheel and pytest
        run: python -m pip install pytest dist/*.whl
      - name: Run the test suite
        run: python -m pytest

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repospace
    permissions:
      id-token: write # mandatory for trusted publishing; granted to this job only
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
